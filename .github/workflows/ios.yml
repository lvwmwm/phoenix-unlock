name: ios-loader

on:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-loader
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check iOS target
        run: cargo check --target aarch64-apple-ios -p phoenix-hook -p phoenix-sigs

  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build iOS loader dylib
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: cargo build --release --target aarch64-apple-ios -p phoenix-loader
      - name: Ad-hoc sign dylib
        run: codesign -s - --force target/aarch64-apple-ios/release/libphoenix.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libphoenix-ios
          path: target/aarch64-apple-ios/release/libphoenix.dylib
          if-no-files-found: error
