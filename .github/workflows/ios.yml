name: ios-loader

on:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build iOS loader dylib
        run: cargo build --release --target aarch64-apple-ios -p phoenix-loader
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libphoenix-ios
          path: target/aarch64-apple-ios/release/libphoenix.dylib
          if-no-files-found: error
